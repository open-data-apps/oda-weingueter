<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Weintypischer Hintergrund-Gradient (Rubinrot bis Burgunder) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9f1239"/>
      <stop offset="50%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>

    <!-- Schatten-Filter (ODAS-Standard) -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Hintergrund: Abgerundetes Quadrat rx=108, ry=108 -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bgGrad)"/>

  <!-- Glanz-Overlay oben-links für Tiefenwirkung -->
  <ellipse cx="160" cy="140" rx="180" ry="160" fill="#ffffff" fill-opacity="0.08"/>

  <!-- Motiv: Weintrauben, Weinblatt & edles Weinglas -->
  <g filter="url(#shadow)">
    <!-- Weinreben-Zweig / Ranke oben -->
    <path d="M 180 150 Q 200 120 220 140 Q 235 155 250 145" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Weinblatt (links oben) -->
    <path d="M 175 145 C 140 120 115 145 125 175 C 105 185 110 215 135 220 C 130 235 150 250 170 240 C 185 245 205 235 200 215 C 220 210 225 180 205 170 C 215 140 190 120 175 145 Z" 
          fill="#ffffff" fill-opacity="0.92"/>
    <!-- Blattadern -->
    <path d="M 170 230 Q 165 185 160 155 M 165 190 L 135 180 M 167 205 L 140 215 M 165 190 L 195 185 M 167 205 L 190 220" 
          fill="none" stroke="#881337" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Weintrauben (Traube links/mittig) -->
    <!-- Obere Beeren -->
    <circle cx="160" cy="245" r="23" fill="#ffffff"/>
    <circle cx="202" cy="242" r="23" fill="#ffffff"/>
    <circle cx="244" cy="245" r="23" fill="#ffffff"/>
    <circle cx="180" cy="215" r="21" fill="#ffffff" fill-opacity="0.95"/>
    <circle cx="222" cy="215" r="21" fill="#ffffff" fill-opacity="0.95"/>

    <!-- Zweite Reihe -->
    <circle cx="145" cy="285" r="22" fill="#ffffff"/>
    <circle cx="186" cy="283" r="23" fill="#ffffff"/>
    <circle cx="228" cy="285" r="22" fill="#ffffff"/>

    <!-- Dritte Reihe -->
    <circle cx="165" cy="325" r="21" fill="#ffffff"/>
    <circle cx="206" cy="325" r="21" fill="#ffffff"/>

    <!-- Vierte Reihe -->
    <circle cx="185" cy="362" r="20" fill="#ffffff"/>
    <circle cx="220" cy="358" r="18" fill="#ffffff" fill-opacity="0.9"/>

    <!-- Spitze der Traube -->
    <circle cx="196" cy="396" r="17" fill="#ffffff"/>

    <!-- Sanfte Innenschattierung auf den Beeren für Plastizität -->
    <g fill="#881337" fill-opacity="0.18">
      <circle cx="163" cy="248" r="14"/>
      <circle cx="205" cy="245" r="14"/>
      <circle cx="247" cy="248" r="14"/>
      <circle cx="148" cy="288" r="13"/>
      <circle cx="189" cy="286" r="14"/>
      <circle cx="231" cy="288" r="13"/>
      <circle cx="167" cy="327" r="12"/>
      <circle cx="208" cy="327" r="12"/>
      <circle cx="187" cy="364" r="11"/>
    </g>

    <!-- Glanzpunkte auf den Beeren -->
    <g fill="#ffffff">
      <circle cx="152" cy="237" r="4.5"/>
      <circle cx="194" cy="234" r="4.5"/>
      <circle cx="236" cy="237" r="4.5"/>
      <circle cx="137" cy="277" r="4"/>
      <circle cx="178" cy="275" r="4.5"/>
      <circle cx="220" cy="277" r="4"/>
      <circle cx="157" cy="317" r="3.8"/>
      <circle cx="198" cy="317" r="3.8"/>
      <circle cx="178" cy="355" r="3.5"/>
    </g>

    <!-- Elegantes Weinglas rechts im Vordergrund -->
    <g>
      <!-- Kelch-Hintergrund transluzent -->
      <path d="M 285 140 C 285 270 385 270 385 140 Z" fill="#ffffff" fill-opacity="0.25"/>
      
      <!-- Roter Wein im Kelch -->
      <path d="M 292 185 C 292 255 378 255 378 185 C 360 192 340 178 335 185 C 330 192 310 178 292 185 Z" 
            fill="#ffffff" fill-opacity="0.92"/>
      <!-- Weinoberfläche Glanzlinie -->
      <ellipse cx="335" cy="185" rx="42" ry="7" fill="#ffffff" fill-opacity="0.5"/>

      <!-- Kelch Glas-Silhouette (Außenlinie) -->
      <path d="M 285 140 C 285 275 385 275 385 140" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
      <ellipse cx="335" cy="140" rx="50" ry="9" fill="none" stroke="#ffffff" stroke-width="7"/>

      <!-- Stiel -->
      <path d="M 331 274 L 331 385 L 339 385 L 339 274 Z" fill="#ffffff"/>

      <!-- Fuß -->
      <path d="M 275 398 C 275 387 395 387 395 398 C 395 403 275 403 275 398 Z" fill="#ffffff"/>

      <!-- Lichtreflex am Kelch links -->
      <path d="M 295 155 C 295 240 330 258 330 258" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.8"/>
    </g>
  </g>
</svg>
